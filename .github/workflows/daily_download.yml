name: Daily CV Download

on:
  schedule:
    # Run every day at 9:00 AM UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  download:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Create storageState.json
      env:
        # We pass the secret as an environment variable to avoid shell parsing issues
        THE_STATE: ${{ secrets.STORAGE_STATE }}
      run: |
        node -e "const fs = require('fs'); fs.writeFileSync('storageState.json', process.env.THE_STATE);"

    - name: Run Download Script
      timeout-minutes: 15
      env:
        CI: true
        # Optional: Add a limit if you want to test quickly, e.g., only process 5 items
        # LIMIT: 5 
      run: |
        npm run download

    - name: Commit and Push changes
      if: success() && steps.git-check.outputs.changes == 'true'
      run: |
        git commit -m "Update urls.txt processing status [skip ci]"
        git push

    - name: Upload Downloaded CVs
      if: always() # Run this even if the download script fails or times out
      uses: actions/upload-artifact@v4
      with:
        name: downloaded-cvs
        path: downloads/
        retention-days: 5
